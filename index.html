<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1222" />
    <title>SOMA KeyDrop</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔑</text></svg>" />

    <script src="/vendor/supabase-js/supabase.js"></script>
    <script src="js/soma-auth-config.js"></script>
    <script src="js/soma-auth.js"></script>

    <link rel="stylesheet" href="/vendor/soma-feedback/soma-feedback.css" />

    <style>
      :root {
        --bg: #0f1222; --bg-2: #171a30; --panel: #1c2038; --border: #2c3157;
        --text: #e8eaf6; --muted: #9aa0c8; --accent: #7c83ff; --accent-2: #4dd6a8;
        --danger: #ff6b7a; --warn: #f4b860; --shadow: 0 8px 30px rgba(0,0,0,0.35);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: radial-gradient(1200px 600px at 80% -10%, #1a1f3d 0%, var(--bg) 55%);
        color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        min-height: 100vh; padding: 40px 20px; line-height: 1.5;
      }
      .wrap { max-width: 560px; margin: 0 auto; }
      .eyebrow { color: var(--accent); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700; }
      h1 { margin: 6px 0 4px; font-size: 24px; }
      .sub { margin: 0 0 8px; color: var(--muted); font-size: 14px; }
      .test-banner {
        background: rgba(244,184,96,0.12); border: 1px solid rgba(244,184,96,0.4); color: var(--warn);
        border-radius: 10px; padding: 10px 14px; font-size: 12px; margin: 14px 0 22px; display: none;
      }
      .test-banner.show { display: block; }
      .step {
        background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
        padding: 22px 24px; margin-bottom: 16px; box-shadow: var(--shadow); opacity: 0.45;
        transition: opacity 0.2s ease;
      }
      .step.active { opacity: 1; border-color: var(--accent); }
      .step.done { opacity: 0.7; }
      .step-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
      .step-num {
        width: 26px; height: 26px; border-radius: 50%; background: var(--bg-2); border: 1px solid var(--border);
        display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0;
      }
      .step.done .step-num { background: var(--accent-2); border-color: var(--accent-2); color: #0f1222; }
      .step.active .step-num { background: var(--accent); border-color: var(--accent); color: #fff; }
      .step-title { font-size: 15px; font-weight: 600; }
      .step-body { font-size: 13px; color: var(--muted); }
      .scopes { list-style: none; padding: 0; margin: 10px 0; font-size: 13px; }
      .scopes li { padding: 4px 0; padding-left: 20px; position: relative; }
      .scopes li::before { content: "☑"; position: absolute; left: 0; color: var(--accent-2); }
      button {
        font-family: inherit; font-size: 14px; font-weight: 600; border-radius: 10px; padding: 11px 18px;
        border: 1px solid transparent; cursor: pointer; transition: filter 0.12s ease; margin-top: 12px;
      }
      button.primary { background: var(--accent); color: #fff; }
      button.primary:hover { filter: brightness(1.1); }
      button.secondary { background: var(--bg-2); color: var(--text); border-color: var(--border); }
      button:disabled { opacity: 0.5; cursor: default; }
      input[type=password] {
        width: 100%; background: var(--bg-2); border: 1px solid var(--border); color: var(--text);
        border-radius: 10px; padding: 11px 12px; font-size: 14px; font-family: inherit; margin-top: 8px;
        letter-spacing: 2px;
      }
      .msg { margin-top: 12px; font-size: 13px; border-radius: 10px; padding: 10px 12px; display: none; }
      .msg.ok { display: block; background: rgba(77,214,168,0.12); color: var(--accent-2); border: 1px solid rgba(77,214,168,0.3); }
      .msg.err { display: block; background: rgba(255,107,122,0.1); color: var(--danger); border: 1px solid rgba(255,107,122,0.3); }
      .msg.warn { display: block; background: rgba(244,184,96,0.1); color: var(--warn); border: 1px solid rgba(244,184,96,0.3); }
      .center { text-align: center; padding: 60px 0; color: var(--muted); }
      .foot { margin-top: 24px; text-align: center; color: var(--muted); font-size: 11px; }
      a.textlink { color: var(--accent); }
    </style>
  </head>
  <body>
    <div class="wrap" id="app">
      <div class="center" id="loading">Loading…</div>
    </div>

    <script src="/js/app.js"></script>

    <script
      src="/vendor/soma-feedback/soma-feedback.js"
      data-site="soma-keydrop"
      data-area="stepper"
      data-no-google
      defer
    ></script>
  </body>
</html>
